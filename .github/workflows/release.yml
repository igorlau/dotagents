name: Release

# Every push to main that passes the checks is staged on npm and tagged.
# The maintainer approves each staged version on npmjs.com with 2FA.
on:
  push:
    branches: [main]

permissions:
  contents: write
  # Lets npm trusted publishing exchange a GitHub OIDC token for publish rights.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:content
      - run: npm test

      # The patch number comes from the run number, so main keeps MAJOR.MINOR
      # in package.json and nobody bumps versions by hand.
      - name: Compute version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "VERSION=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Stage the npm release
        run: |
          npm version "$VERSION" --no-git-tag-version
          npm stage publish

      # The tag points to a commit outside main that records the version.
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "release: v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the GitHub release with a tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "v$VERSION" "igorlau-dotagents-$VERSION.tgz" --title "v$VERSION" --generate-notes

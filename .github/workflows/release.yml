name: Release

# release-please keeps a release pull request open from the Conventional
# Commits on main. Its merge tags the version, and the publish job stages it
# on npm. The maintainer approves each staged version on npmjs.com with 2FA.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Lets npm trusted publishing exchange a GitHub OIDC token for publish rights.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:content
      - run: npm test
      - name: Check that the build reports the release version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: test "$(node dist/cli.js --version)" = "${TAG#v}"
      - run: npm stage publish

      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" igorlau-dotagents-*.tgz

name: Release

# Every push to main that passes the checks becomes a tagged release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:content
      - run: npm test

      # The patch number comes from the run number, so main keeps MAJOR.MINOR
      # in package.json and nobody bumps versions by hand.
      - name: Compute version
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "VERSION=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # The tag points to a commit outside main that records the version, so
      # `dotagents --version` reports it when installed from the tag.
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit --quiet -am "release: v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish the GitHub release with a tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "v$VERSION" "dotagents-$VERSION.tgz" --title "v$VERSION" --generate-notes
